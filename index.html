<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>STV Life Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game">
    <h1>🎤 STV Life Simulator</h1>

    <div class="stats">
      <p>Energy: <span id="energy">100</span></p>
      <p>Money: $<span id="money">50</span></p>
      <p>Fame: <span id="fame">0</span></p>
    </div>

    <div class="actions">
      <button onclick="sleep()">Sleep</button>
      <button onclick="eat()">Eat</button>
      <button onclick="record()">Record</button>
      <button onclick="post()">Post</button>
      <button onclick="perform()">Perform</button>
    </div>

    <div class="log" id="log"></div>
  </div>

<script src="app.js"></script>
</body>
</html>
